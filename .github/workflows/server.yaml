name: Server
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**']
  pull_request:
    paths: ['server/**']

defaults:
  run:
    shell: bash
    working-directory: ./server

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: |
            db
            server
            .env.example
            .envrc

      - name: Setup environment file at root
        working-directory: .
        run: cp .env.example .env

      - name: Setup environment file at server
        run: cp .env.example .env

      - name: Restore direnv cache
        id: cache-direnv
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /opt/pipx_bin/direnv
          key: ${{ runner.os }}-direnv-cache

      - name: Install direnv if not cached
        if: steps.cache-direnv.outputs.cache-hit != 'true'
        run: |
          curl -sfL https://direnv.net/install.sh | bash

      - name: Save direnv cache
        if: steps.cache-direnv.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /opt/pipx_bin/direnv
          key: ${{ runner.os }}-direnv-cache

      - name: Allow .envrc
        run: direnv allow

      - name: Load PATH changes
        run: direnv exec . sh -c 'echo $PATH' > "$GITHUB_PATH"

      - name: Load other environment changes
        run: direnv export gha >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
        with:
          distribution: temurin
          java-version: 21.0.4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Gradle reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: Gradle reports
          path: ./server/build/reports
